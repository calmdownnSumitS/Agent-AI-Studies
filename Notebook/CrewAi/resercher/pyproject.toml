[project]
name = "resercher"
version = "0.1.0"
description = "resercher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
resercher = "resercher.main:run"
run_crew = "resercher.main:run"
train = "resercher.main:train"
replay = "resercher.main:replay"
test = "resercher.main:test"
run_with_trigger = "resercher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
